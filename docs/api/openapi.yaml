      responses:
        '204': { description: Berhasil }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workouts/{workoutId}/exercises/{workoutExerciseId}/sets:
    parameters:
      - { name: workoutId, in: path, required: true, schema: { type: string } }
      - { name: workoutExerciseId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Workouts]
      summary: Catat set
      description: |
        Menghitung `volume_kg`, `est_1rm_kg`, mendeteksi PR, dan memperbarui agregat sesi.
        Mendukung header `Idempotency-Key` untuk mencegah duplikasi saat offline sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weight_kg: { type: number, minimum: 0, maximum: 1000 }
                reps: { type: integer, minimum: 0, maximum: 500 }
                rpe: { type: number, minimum: 0.5, maximum: 10 }
                is_warmup: { type: boolean, default: false }
                is_completed: { type: boolean, default: true }
                duration_seconds: { type: integer, minimum: 0 }
                distance_km: { type: number, minimum: 0 }
                avg_heart_rate: { type: integer, minimum: 30, maximum: 230 }
                calories: { type: integer, minimum: 0 }
      responses:
        '201':
          description: Set tercatat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkoutSet' }
                  meta:
                    type: object
                    properties:
                      workout_total_volume_kg: { type: number }
                      prs_created: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }

  /workouts/{workoutId}/exercises/{workoutExerciseId}/sets/{setId}:
    parameters:
      - { name: workoutId, in: path, required: true, schema: { type: string } }
      - { name: workoutExerciseId, in: path, required: true, schema: { type: string } }
      - { name: setId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Workouts]
      summary: Ubah set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weight_kg: { type: number, minimum: 0, maximum: 1000 }
                reps: { type: integer, minimum: 0, maximum: 500 }
                rpe: { type: number, minimum: 0.5, maximum: 10 }
                is_warmup: { type: boolean }
                is_completed: { type: boolean }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkoutSet' }
    delete:
      tags: [Workouts]
      summary: Hapus set
      responses:
        '204': { description: Berhasil }

