                      file_size_bytes: { type: [integer, 'null'] }
                      expired: { type: boolean }
                      error_message: { type: [string, 'null'] }
    delete:
      tags: [Exports]
      summary: Hapus export dan file
      parameters:
        - { name: exportId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Berhasil }
        '403': { description: Bukan pemilik }

  /exports/{exportId}/download:
    parameters:
      - { name: exportId, in: path, required: true, schema: { type: string } }
      - { name: token, in: query, required: true, schema: { type: string } }
    get:
      tags: [Exports]
      summary: Download export (session + signed token + ownership)
      responses:
        '200': { description: File biner }
        '403': { description: Token salah atau bukan pemilik }
        '410': { description: Link kedaluwarsa (EXPORT_EXPIRED) }

  /reports/monthly:
    post:
      tags: [Exports]
      summary: Buat job laporan PDF bulanan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month]
              properties:
                month: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-10' }
                include_body_metrics: { type: boolean, default: true }
      responses:
        '202':
          description: Job dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      report_id: { type: string }
                      status: { type: string }

  /reports/{reportId}:
    get:
      tags: [Exports]
      summary: Status laporan PDF
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      report_id: { type: string }
                      status: { type: string, enum: [queued, running, ready, failed] }
                      download_url: { type: [string, 'null'] }
                      expires_at: { type: [string, 'null'], format: date-time }
                      file_size_bytes: { type: [integer, 'null'] }
                      error_message: { type: [string, 'null'] }

  /reports/{reportId}/download:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string } }
      - { name: token, in: query, required: true, schema: { type: string } }
    get:
      tags: [Exports]
      summary: Download PDF laporan (session + signed token + ownership)
      responses:
        '200': { description: File PDF }
        '403': { description: Token salah atau bukan pemilik }
        '410': { description: Link kedaluwarsa (EXPORT_EXPIRED) }

  # ──────────────────────────────── NOTIFICATIONS ────────────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      summary: Daftar notifikasi in-app
      parameters:
        - { name: unread_only, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: limit, in: query, schema: { type: integer, default: 30 } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta:
                    type: object
                    properties:
                      unread_count: { type: integer }

  /notifications/{notificationId}:
    parameters:
      - { name: notificationId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Notifications]
      summary: Tandai satu notifikasi dibaca
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Notification' }

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Tandai semua notifikasi dibaca
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated: { type: integer }

  # ──────────────────────────────── ADMIN ────────────────────────────────
  /admin/exercises:
    get:
      tags: [Admin]
      summary: Daftar exercise termasuk draft (role admin)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [published, draft, archived] } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Exercise' }
        '403': { description: Role admin diperlukan }
    post:
      tags: [Admin]
      summary: Buat exercise global sebagai draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AdminExerciseInput'
              required: [name_id, primary_muscle, equipment]
      responses:
        '201': { description: Dibuat }

  /admin/exercises/{exerciseId}:
    parameters:
      - { name: exerciseId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Admin]
      summary: Edit/publish exercise tanpa deploy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminExerciseInput' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Exercise' }
        '403': { description: Role admin diperlukan }

  # ──────────────────────────────── META ────────────────────────────────
  /summary/today:
    get:
      tags: [Meta]
      summary: Ringkasan hari ini (untuk widget mobile)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      active_program: { type: [string, 'null'] }
                      today_session_name: { type: [string, 'null'] }
                      today_session_exercises: { type: integer }
                      week_workouts: { type: integer }
                      week_volume_kg: { type: number }
                      current_streak: { type: integer }
                      unread_recommendations: { type: integer }

  /health:
    get:
      tags: [Meta]
      summary: Health check (public, tanpa data sensitif)
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  timestamp: { type: string, format: date-time }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: degraded }
                  version: { type: string }
                  timestamp: { type: string, format: date-time }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gymapps_session
      description: Token opaque; cookie `HttpOnly; Secure; SameSite=Lax; Max-Age=2592000`, di-refresh otomatis selama aktif
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Belum terautentikasi atau session kedaluwarsa
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Tidak diizinkan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Konflik state (mis. email sudah terdaftar, program aktif sudah ada)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Rate limit terlampaui
      headers:
        X-RateLimit-Limit: { schema: { type: integer } }
        X-RateLimit-Remaining: { schema: { type: integer } }
        X-RateLimit-Reset: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  path: { type: string }
                  message: { type: string }
            request_id: { type: string }

    Muscle:
      type: string
      enum: [chest, back, shoulders, biceps, triceps, forearms, quads, hamstrings, glutes, calves, abs, obliques, adductors, abductors, lats, traps, lower_back, full_body, cardio, core]

    Equipment:
      type: string
      enum: [bodyweight, dumbbell, barbell, machine, cable, bench, pullup_bar, kettlebell, resistance_band, cardio_machine, smith_machine, dip_bar, landmine, sled, other]

    AuthSession:
      type: object
      description: Sesi persisten 30 hari (sliding). Cookie `gymapps_session` diset saat register/login.
      properties:
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/CurrentUser' }
            expires_at: { type: string, format: date-time }

    CurrentUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: [string, 'null'] }
        locale: { type: string, enum: [id, en] }
        unit_system: { type: string, enum: [metric, imperial] }
        timezone: { type: string }
        theme: { type: string, enum: [light, dark, system] }
        email_opt_in: { type: boolean }
        onboarding_completed: { type: boolean }
        entitlement:
          type: object
          properties:
            plan: { type: string, enum: [free, pro] }
            ai_chat_daily_limit: { type: integer }
            ai_generate_daily_limit: { type: integer }
            features: { type: object, additionalProperties: true }

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/UserProfileInput'
        - type: object
          properties:
            id: { type: string }
            user_id: { type: string }
            height_cm: { type: [number, 'null'] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    UserProfileInput:
      type: object
      properties:
        goals:
          type: array
          maxItems: 2
          items:
            type: string
            enum: [lose_weight, gain_muscle, strength, endurance, general_fitness, body_recomposition]
        experience_level: { type: string, enum: [beginner, intermediate, advanced] }
        days_per_week: { type: integer, minimum: 1, maximum: 7 }
        session_minutes: { type: integer, minimum: 20, maximum: 120 }
        equipment:
          type: array
          items: { $ref: '#/components/schemas/Equipment' }
        injury_areas:
          type: array
          items:
            type: string
            enum: [knee, shoulder, lower_back, elbow, wrist, hip, ankle, neck, hamstring, groin, none]
        injury_notes: { type: string, maxLength: 1000 }
        preferred_split:
          type: string
          enum: [full_body, upper_lower, push_pull_legs, bro_split, custom]
        preferred_cardio: { type: array, items: { type: string } }
        height_cm: { type: number, minimum: 80, maximum: 250 }
        birth_date: { type: string, format: date }
        sex: { type: string, enum: [male, female, other, prefer_not_to_say] }
        program_style_notes: { type: string, maxLength: 2000 }
        display_name: { type: string, maxLength: 80 }
        locale: { type: string, enum: [id, en] }
        unit_system: { type: string, enum: [metric, imperial] }
        timezone: { type: string }
        theme: { type: string, enum: [light, dark, system] }
        email_opt_in: { type: boolean }

    Exercise:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name_id: { type: string }
        name_en: { type: string }
        description_id: { type: [string, 'null'] }
        description_en: { type: [string, 'null'] }
        primary_muscle: { $ref: '#/components/schemas/Muscle' }
        secondary_muscles:
          type: array
          items: { $ref: '#/components/schemas/Muscle' }
        equipment:
          type: array
          items: { $ref: '#/components/schemas/Equipment' }
        difficulty: { type: string, enum: [beginner, intermediate, advanced] }
        movement_pattern: { type: [string, 'null'] }
        impact_level: { type: string, enum: [low, medium, high] }
        is_compound: { type: boolean }
        status: { type: string, enum: [draft, published, archived] }
        source: { type: string, enum: [seed, custom, admin] }
        media:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [image, video] }
              url: { type: string }
              is_primary: { type: boolean }

    ExerciseDetail:
      allOf:
        - $ref: '#/components/schemas/Exercise'
        - type: object
          properties:
            instructions_id:
              type: array
              items: { type: string }
            instructions_en:
              type: array
              items: { type: string }
            stats:
              type: object
              properties:
                last_performed_at: { type: [string, 'null'], format: date-time }
                session_count: { type: integer }
                best_set: { type: [string, 'null'] }
                best_est_1rm_kg: { type: [number, 'null'] }
                volume_30d_kg: { type: number }

    Program:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [draft, active, completed, archived] }
        source: { type: string, enum: [manual, ai, template] }
        goal: { type: [string, 'null'] }
        split_type: { type: string }
        duration_weeks: { type: integer }
        days_per_week: { type: integer }
        session_minutes: { type: integer }
        start_date: { type: [string, 'null'], format: date }
        progression_type: { type: string }
        ai_generated: { type: boolean }
        ai_rationale:
          type: [object, 'null']
          properties:
            summary: { type: string }
            assumptions: { type: array, items: { type: string } }
            safety_notes: { type: array, items: { type: string } }
        completion_pct: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProgramInput:
      type: object
      required: [name, split_type, duration_weeks, days_per_week]
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        goal: { type: string }
        split_type: { type: string, enum: [full_body, upper_lower, push_pull_legs, bro_split, custom] }
        duration_weeks: { type: integer, minimum: 1, maximum: 52 }
        days_per_week: { type: integer, minimum: 1, maximum: 7 }
        session_minutes: { type: integer, minimum: 20, maximum: 120 }
        start_date: { type: string, format: date }
        progression_type:
          type: string
          enum: [double_progression, linear, rpe_target, percent_1rm, none]
          default: double_progression

    ProgramDetail:
      allOf:
        - $ref: '#/components/schemas/Program'
        - type: object
          properties:
            weeks:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  week_number: { type: integer }
                  focus_note: { type: [string, 'null'] }
                  is_deload: { type: boolean }
                  volume_multiplier: { type: number }
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/ProgramSession' }

    ProgramSession:
      type: object
      properties:
        id: { type: string }
        week_number: { type: integer }
        day_index: { type: integer, minimum: 1, maximum: 7 }
        name: { type: string }
        notes: { type: [string, 'null'] }
        estimated_minutes: { type: [integer, 'null'] }
        completed_at: { type: [string, 'null'], format: date-time }
        exercises:
          type: array
          items: { $ref: '#/components/schemas/ProgramExercise' }

    ProgramExercise:
      type: object
      properties:
        id: { type: string }
        exercise_id: { type: string }
        exercise_name: { type: string }
        position: { type: integer }
        target_sets: { type: integer }
        target_reps_min: { type: integer }
        target_reps_max: { type: integer }
        target_rpe: { type: [number, 'null'] }
        rest_seconds: { type: integer }
        tempo: { type: [string, 'null'] }
        is_warmup: { type: boolean }
        superset_group: { type: [integer, 'null'] }
        notes: { type: [string, 'null'] }
        progression:
          type: object
          properties:
            type: { type: string }
            increment_kg: { type: [number, 'null'] }
            increment_reps: { type: [integer, 'null'] }
            max_reps: { type: [integer, 'null'] }

    ProgramExerciseInput:
      type: object
      required: [exercise_id]
      properties:
        exercise_id: { type: string }
        position: { type: integer, minimum: 1, maximum: 20 }
        target_sets: { type: integer, minimum: 1, maximum: 10 }
        target_reps_min: { type: integer, minimum: 1, maximum: 50 }
        target_reps_max: { type: integer, minimum: 1, maximum: 50 }
        target_rpe: { type: number, minimum: 5, maximum: 10 }
        rest_seconds: { type: integer, minimum: 30, maximum: 300 }
        tempo: { type: string }
        is_warmup: { type: boolean }
        superset_group: { type: integer }
        notes: { type: string, maxLength: 200 }

    ProgramGenerateInput:
      type: object
      required: [goal, split_type, duration_weeks, days_per_week]
      properties:
        goal:
          type: string
          enum: [lose_weight, gain_muscle, strength, endurance, general_fitness, body_recomposition]
        split_type:
          type: string
          enum: [full_body, upper_lower, push_pull_legs, bro_split, custom]
        duration_weeks: { type: integer, minimum: 1, maximum: 52 }
        days_per_week: { type: integer, minimum: 1, maximum: 7 }
        session_minutes: { type: integer, minimum: 20, maximum: 120 }
        equipment_overrides:
          type: array
          items: { $ref: '#/components/schemas/Equipment' }
        focus_areas:
          type: array
          items: { $ref: '#/components/schemas/Muscle' }
        avoid_areas:
          type: array
          items: { type: string }
        notes: { type: string, maxLength: 1000 }

    Workout:
      type: object
      properties:
        id: { type: string }
        title: { type: [string, 'null'] }
        status: { type: string, enum: [active, finished, abandoned] }
        program_id: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        duration_seconds: { type: [integer, 'null'] }
        total_volume_kg: { type: number }
        total_sets: { type: integer }
        total_reps: { type: integer }
        bodyweight_kg: { type: [number, 'null'] }
        session_rpe: { type: [number, 'null'] }
        exercise_count: { type: integer }
        pr_count: { type: integer }

    WorkoutDetail:
      allOf:
        - $ref: '#/components/schemas/Workout'
        - type: object
          properties:
            notes: { type: [string, 'null'] }
            exercises:
              type: array
              items: { $ref: '#/components/schemas/WorkoutExercise' }

    WorkoutExercise:
      type: object
      properties:
        id: { type: string }
        exercise_id: { type: string }
        exercise_name: { type: string }
        position: { type: integer }
        notes: { type: [string, 'null'] }
        superset_group: { type: [integer, 'null'] }
        previous_performance:
          type: [object, 'null']
          properties:
            date: { type: string, format: date-time }
            sets:
              type: array
              items:
                type: object
                properties:
                  weight_kg: { type: number }
                  reps: { type: integer }
        sets:
          type: array
          items: { $ref: '#/components/schemas/WorkoutSet' }

    WorkoutSet:
      type: object
      properties:
        id: { type: string }
        set_number: { type: integer }
        weight_kg: { type: number }
        reps: { type: integer }
        rpe: { type: [number, 'null'] }
        is_warmup: { type: boolean }
        is_completed: { type: boolean }
        is_pr: { type: boolean }
        est_1rm_kg: { type: [number, 'null'] }
        volume_kg: { type: number }
        duration_seconds: { type: [integer, 'null'] }
        distance_km: { type: [number, 'null'] }
        delta_vs_last:
          type: [object, 'null']
          properties:
            weight_kg: { type: number }
            reps: { type: integer }

    PersonalRecord:
      type: object
      properties:
        id: { type: string }
        exercise_id: { type: string }
        exercise_name: { type: string }
        record_type: { type: string, enum: [max_weight, max_reps, max_volume, est_1rm] }
        value: { type: number }
        reps: { type: [integer, 'null'] }
        weight_kg: { type: [number, 'null'] }
        achieved_at: { type: string, format: date-time }
        is_current: { type: boolean }

    Recommendation:
      type: object
      properties:
        id: { type: string }
        rule:
          type: string
          enum: [plateau_detection, deload_suggestion, volume_imbalance, adherence_drop, overtraining_risk, pr_milestone, stale_program, missing_equipment_conflict, frequency_low]
        severity: { type: string, enum: [P1, P2, P3] }
        title: { type: string }
        body: { type: [string, 'null'] }
        evidence:
          type: object
          additionalProperties: true
          properties:
            metric: { type: string }
            value: { type: number }
            unit: { type: string }
            delta_pct: { type: [number, 'null'] }
        action_type: { type: [string, 'null'] }
        status: { type: string, enum: [new, read, dismissed, acted] }
        created_at: { type: string, format: date-time }

    AdminExerciseInput:
      type: object
      properties:
        name_id: { type: string, maxLength: 120 }
        name_en: { type: string, maxLength: 120 }
        description_id: { type: [string, 'null'], maxLength: 3000 }
        description_en: { type: [string, 'null'], maxLength: 3000 }
        instructions_id: { type: array, items: { type: string } }
        instructions_en: { type: array, items: { type: string } }
        primary_muscle: { type: string }
        secondary_muscles: { type: array, items: { type: string } }
        equipment: { type: array, items: { type: string } }
        difficulty: { type: string, enum: [beginner, intermediate, advanced] }
        impact_level: { type: string, enum: [low, medium, high] }
        contraindicated_areas: { type: array, items: { type: string } }
        is_compound: { type: boolean }
        status: { type: string, enum: [published, draft, archived] }
        review_notes: { type: [string, 'null'] }

    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        body: { type: [string, 'null'] }
        link: { type: [string, 'null'] }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    ChatThread:
      type: object
      properties:
        id: { type: string }
        title: { type: [string, 'null'] }
        program_id: { type: [string, 'null'] }
        message_count: { type: integer }
        last_message_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    ChatMessage:
      type: object
      properties:
        id: { type: string }
        thread_id: { type: string }
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        status: { type: string, enum: [streaming, complete, aborted, error] }
        citations:
          type: [array, 'null']
          items:
            type: object
            properties:
              type: { type: string, example: workout }
              ref_id: { type: string }
              label: { type: string }
        feedback: { type: [integer, 'null'] }
        created_at: { type: string, format: date-time }

    BodyMetric:
      type: object
      properties:
        id: { type: string }
        recorded_on: { type: string, format: date }
        weight_kg: { type: [number, 'null'] }
        body_fat_pct: { type: [number, 'null'] }
        chest_cm: { type: [number, 'null'] }
        waist_cm: { type: [number, 'null'] }
        hip_cm: { type: [number, 'null'] }
        arm_cm: { type: [number, 'null'] }
        thigh_cm: { type: [number, 'null'] }
        calf_cm: { type: [number, 'null'] }
        shoulder_cm: { type: [number, 'null'] }
        photo_urls:
          type: array
          items: { type: string }
        notes: { type: [string, 'null'] }

    Note:
