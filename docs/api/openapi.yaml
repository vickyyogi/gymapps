  # ──────────────────────────────── AI ────────────────────────────────
  /ai/programs/generate:
    post:
      tags: [AI]
      summary: Buat program dengan AI (async job)
      description: |
        Membuat job generate program. Program hasil **selalu** berstatus `draft` dan wajib
        di-review/aktivasi user. Jika output AI gagal validasi 2×, sistem memakai generator
        rule-based fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramGenerateInput' }
      responses:
        '202':
          description: Job dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id: { type: string }
                      status: { type: string, enum: [queued, running, succeeded, failed] }
                      steps:
                        type: array
                        items: { type: string, enum: [analyzing_profile, drafting_program, validating, finalizing] }
        '429':
          description: Kuota harian habis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /ai/jobs/{jobId}:
    get:
      tags: [AI]
      summary: Status job AI
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id: { type: string }
                      status: { type: string, enum: [queued, running, succeeded, failed] }
                      current_step: { type: string }
                      progress_pct: { type: integer }
                      result:
                        type: object
                        properties:
                          program_id: { type: string }
                          fallback_used: { type: boolean }
                          repair_attempts: { type: integer }
                      error: { $ref: '#/components/schemas/ErrorResponse' }

  /ai/programs/{programId}/regenerate:
    parameters:
      - { name: programId, in: path, required: true, schema: { type: string } }
    post:
      tags: [AI]
      summary: Regenerate program dengan constraint baru
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramGenerateInput' }
      responses:
        '202':
          description: Job dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id: { type: string }
                      status: { type: string }

