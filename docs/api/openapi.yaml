      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChatThread' }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [AI]
      summary: Buat thread chat baru
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 120 }
                program_id: { type: string }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ChatThread' }

  /ai/coach/threads/{threadId}/messages:
    parameters:
      - { name: threadId, in: path, required: true, schema: { type: string } }
    get:
      tags: [AI]
      summary: Riwayat pesan (cursor pagination, urutan kronologis)
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [AI]
      summary: Kirim pesan ke coach (SSE stream)
      description: |
        Mengembalikan `text/event-stream` dengan event: `meta`, `delta`, `tool`, `done`, `error`.
        Mendukung `Idempotency-Key` untuk mencegah pesan ganda saat retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 4000 }
                language: { type: string, enum: [id, en] }
      responses:
        '200':
          description: Stream SSE
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  value: |
                    event: meta
                    data: {"message_id":"msg_01HQ8Z...","thread_id":"thr_01HQ8Y..."}

                    event: delta
                    data: {"text":"Program kamu 4 hari"}

                    event: tool
                    data: {"name":"get_active_program","status":"done"}

                    event: done
                    data: {"input_tokens":812,"output_tokens":146,"cost_usd":0.0021}

        '429':
          description: Kuota habis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /ai/coach/threads/{threadId}:
    parameters:
      - { name: threadId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [AI]
      summary: Hapus thread
      responses:
        '204': { description: Berhasil }

  /ai/coach/messages/{messageId}/feedback:
    parameters:
      - { name: messageId, in: path, required: true, schema: { type: string } }
    post:
      tags: [AI]
      summary: Berikan rating pada jawaban coach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, enum: [1, -1] }
                comment: { type: string, maxLength: 1000 }
      responses:
        '204': { description: Berhasil }

