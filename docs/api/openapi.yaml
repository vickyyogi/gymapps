openapi: 3.1.0

info:
  title: GymApps API
  version: 1.0.0
  description: |
    REST API untuk GymApps — workout tracker + AI coach.

    **Konvensi**
    - Base path: `/api/v1`
    - Auth: `Cookie: gymapps_session=<token>` (web) atau `Authorization: Bearer <jwt>` (mobile)
    - Sesi web persisten 30 hari (sliding). Saat app dibuka, panggil `GET /auth/me` untuk restore sesi; 401 = belum login.
    - Pagination: cursor-based (`?cursor=&limit=`), respons `{ "data": [...], "nextCursor": string|null }`
    - Error: `{ "error": { "code": "...", "message": "...", "details": [...] } }`
    - Semua timestamp ISO-8601 UTC. Semua satuan metric (kg, km, cm).
    - Mutation kritikal menerima header `Idempotency-Key` (UUID).
    - Rate limit: header `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`; 429 saat habis.

  contact:
    name: GymApps Engineering
    email: engineering@gymapps.id
  license:
    name: Proprietary

servers:
  - url: https://api.gymapps.id/api/v1
    description: Production
  - url: https://staging.api.gymapps.id/api/v1
    description: Staging
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Auth
    description: Registrasi, login, sesi persisten (email + password)
  - name: Profile
    description: Profil latihan & preferensi
  - name: Exercises
    description: Katalog gerakan
  - name: Programs
    description: Program latihan manual
  - name: Workouts
    description: Sesi latihan & set
  - name: Analytics
    description: Statistik & progres
  - name: AI
    description: Program generator, coach chat, rekomendasi
  - name: BodyMetrics
    description: Berat & ukuran tubuh
  - name: Notes
    description: Catatan user
  - name: Templates
    description: Workout template
  - name: Exports
    description: Export data & laporan PDF
  - name: Notifications
    description: Notifikasi in-app
  - name: Admin
    description: Admin CMS (role admin)
  - name: Meta
    description: Health check & data master

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ──────────────────────────────── AUTH ────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Daftar dengan email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, locale]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                display_name: { type: string, maxLength: 80 }
                locale: { type: string, enum: [id, en], default: id }
                accept_terms: { type: boolean, const: true }
                birth_date: { type: string, format: date }
      responses:
        '201':
          description: Akun dibuat dan sesi login langsung dibuat (cookie 30 hari)
          headers:
            Set-Cookie:
              description: '`gymapps_session=<token>; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=2592000`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login dengan email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Berhasil. Cookie sesi persisten 30 hari dikirim; sesi bertahan walau browser/aplikasi ditutup
          headers:
            Set-Cookie:
              description: '`gymapps_session=<token>; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=2592000`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Hapus session saat ini dan cookie
      responses:
        '204':
          description: Berhasil
          headers:
            Set-Cookie:
              description: '`gymapps_session=; Path=/; Max-Age=0`'
              schema: { type: string }

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke semua session user
      responses:
        '204': { description: Berhasil }

  /auth/token:
    post:
      tags: [Auth]
      summary: Tukar refresh token menjadi access token JWT (untuk mobile)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Token baru
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
                      refresh_token: { type: string }
                      token_type: { type: string, example: Bearer }
                      expires_in: { type: integer, example: 900 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: User saat ini + profil + entitlement (dipakai untuk restore sesi saat app dibuka)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Kirim email reset password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Selalu 202 (respons generik demi keamanan) }

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Set password baru dengan token reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Berhasil }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/password/change:
    post:
      tags: [Auth]
      summary: Ganti password saat ini (merevoke semua sesi perangkat lain)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, minLength: 1, maxLength: 128 }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Berhasil }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /account:
    delete:
      tags: [Auth]
      summary: Hapus akun (soft-delete 30 hari sebelum hard-delete permanen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirm]
              properties:
                password: { type: string, minLength: 1, maxLength: 128 }
                confirm: { type: string, enum: [DELETE] }
      responses:
        '200':
          description: Akun dijadwalkan untuk penghapusan permanen dalam 30 hari
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [pending_delete] }
                      hard_delete_after_days: { type: integer, example: 30 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ──────────────────────────────── PROFILE ────────────────────────────────
  /profile:
    get:
      tags: [Profile]
      summary: Ambil profil latihan
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UserProfile' }
    patch:
      tags: [Profile]
      summary: Update profil latihan & preferensi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileInput' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UserProfile' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /profile/onboarding:
    post:
      tags: [Profile]
      summary: Tandai onboarding selesai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                step: { type: string, enum: [goal, level, schedule, equipment, preferences, done] }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      onboarding_completed: { type: boolean }
                      step: { type: string }

  # ──────────────────────────────── EXERCISES ────────────────────────────────
  /exercises:
    get:
      tags: [Exercises]
      summary: Cari & filter katalog exercise
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Pencarian nama (ID/EN/alias)' }
        - { name: muscle, in: query, schema: { $ref: '#/components/schemas/Muscle' } }
        - { name: equipment, in: query, schema: { type: array, items: { $ref: '#/components/schemas/Equipment' } }, style: form, explode: false }
        - { name: difficulty, in: query, schema: { type: string, enum: [beginner, intermediate, advanced] } }
        - { name: available_only, in: query, schema: { type: boolean }, description: 'Hanya exercise yang cocok dengan equipment user' }
        - { name: include_custom, in: query, schema: { type: boolean, default: true } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Exercise' }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [Exercises]
      summary: Buat exercise custom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name_id, primary_muscle, equipment]
              properties:
                name_id: { type: string, maxLength: 120 }
                name_en: { type: string, maxLength: 120 }
                description_id: { type: string, maxLength: 500 }
                instructions_id: { type: array, items: { type: string }, maxItems: 6 }
                primary_muscle: { $ref: '#/components/schemas/Muscle' }
                secondary_muscles: { type: array, items: { $ref: '#/components/schemas/Muscle' } }
                equipment: { type: array, items: { $ref: '#/components/schemas/Equipment' } }
                difficulty: { type: string, enum: [beginner, intermediate, advanced] }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Exercise' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /exercises/{exerciseId}:
    parameters:
      - { name: exerciseId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Exercises]
      summary: Detail exercise + statistik user
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ExerciseDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Exercises]
      summary: Edit exercise (custom milik sendiri, atau global bila admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name_id: { type: string, maxLength: 120 }
                name_en: { type: string, maxLength: 120 }
                description_id: { type: string, maxLength: 500 }
                instructions_id: { type: array, items: { type: string }, maxItems: 6 }
                instructions_en: { type: array, items: { type: string }, maxItems: 6 }
                primary_muscle: { $ref: '#/components/schemas/Muscle' }
                secondary_muscles: { type: array, items: { $ref: '#/components/schemas/Muscle' } }
                equipment: { type: array, items: { $ref: '#/components/schemas/Equipment' } }
                difficulty: { type: string, enum: [beginner, intermediate, advanced] }
                status: { type: string, enum: [draft, published, archived] }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Exercise' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Exercises]
      summary: Archive exercise custom (ditolak bila sudah dipakai)
      responses:
        '204': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }

  /muscles:
    get:
      tags: [Meta]
      summary: Master data otot
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { $ref: '#/components/schemas/Muscle' }
                        name_id: { type: string }
                        name_en: { type: string }
                        group: { type: string, enum: [push, pull, legs, core, full_body, cardio] }

  /equipment:
    get:
      tags: [Meta]
      summary: Master data equipment
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { $ref: '#/components/schemas/Equipment' }
                        name_id: { type: string }
                        name_en: { type: string }

  # ──────────────────────────────── PROGRAMS ────────────────────────────────
  /programs:
    get:
      tags: [Programs]
      summary: Daftar program user
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, active, completed, archived] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Program' }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [Programs]
      summary: Buat program manual
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Program' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /programs/{programId}:
    parameters:
      - { name: programId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Programs]
      summary: Detail program lengkap (weeks → sessions → exercises)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProgramDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Programs]
      summary: Update program
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramInput' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Program' }
    delete:
      tags: [Programs]
      summary: Archive program
      responses:
        '204': { description: Berhasil }
        '404': { $ref: '#/components/responses/NotFound' }

  /programs/{programId}/activate:
    parameters:
      - { name: programId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Programs]
      summary: Aktifkan program (program aktif lain di-arsipkan)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Program' }
        '404': { $ref: '#/components/responses/NotFound' }

  /programs/{programId}/duplicate:
    parameters:
      - { name: programId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Programs]
      summary: Duplikat program
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Program' }

  /programs/{programId}/sessions:
    parameters:
      - { name: programId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Programs]
      summary: Tambah sesi ke program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [week_number, day_index, name]
              properties:
                week_number: { type: integer, minimum: 1, maximum: 52 }
                day_index: { type: integer, minimum: 1, maximum: 7 }
                name: { type: string, maxLength: 60 }
                notes: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProgramSession' }

  /programs/{programId}/sessions/{sessionId}/exercises:
    parameters:
      - { name: programId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Programs]
      summary: Tambah exercise ke sesi program
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramExerciseInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProgramExercise' }

  /programs/{programId}/sessions/{sessionId}/exercises/{programExerciseId}:
    parameters:
      - { name: programId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
      - { name: programExerciseId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Programs]
      summary: Update exercise di program
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramExerciseInput' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProgramExercise' }
    delete:
      tags: [Programs]
      summary: Hapus exercise dari program
      responses:
        '204': { description: Berhasil }

  # ──────────────────────────────── WORKOUTS ────────────────────────────────
  /workouts:
    get:
      tags: [Workouts]
      summary: Riwayat workout
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: program_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, finished, abandoned] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Workout' }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [Workouts]
      summary: Mulai sesi latihan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string, enum: [quick, program, template] }
                program_session_id: { type: string }
                template_id: { type: string }
                title: { type: string, maxLength: 120 }
                started_at: { type: string, format: date-time }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkoutDetail' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /workouts/active:
    get:
      tags: [Workouts]
      summary: Sesi draft yang belum selesai
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Workout' }

  /workouts/{workoutId}:
    parameters:
      - { name: workoutId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Workouts]
      summary: Detail sesi + exercise + set
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkoutDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workouts]
      summary: Update sesi (judul, notes, status)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 120 }
                notes: { type: string, maxLength: 5000 }
                bodyweight_kg: { type: number, minimum: 0, maximum: 500 }
                session_rpe: { type: number, minimum: 1, maximum: 10 }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkoutDetail' }
    delete:
      tags: [Workouts]
      summary: Hapus sesi (soft delete)
      responses:
        '204': { description: Berhasil }

  /workouts/{workoutId}/exercises:
    parameters:
      - { name: workoutId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Workouts]
      summary: Tambah exercise ke sesi berjalan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exercise_id]
              properties:
                exercise_id: { type: string }
                notes: { type: string, maxLength: 1000 }
                superset_group: { type: integer, minimum: 1, maximum: 9 }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkoutExercise' }

  /workouts/{workoutId}/exercises/{workoutExerciseId}:
    parameters:
      - { name: workoutId, in: path, required: true, schema: { type: string } }
      - { name: workoutExerciseId, in: path, required: true, schema: { type: string } }
