services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymapps
      POSTGRES_PASSWORD: gymapps
      POSTGRES_DB: gymapps
    ports:
      - "5432:5432"
    volumes:
      - gymapps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymapps -d gymapps"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible lokal untuk uji jalur object storage (image MinIO tidak lagi
  # dipublikasikan di Docker Hub/quay, jadi pakai s3mock).
  s3mock:
    image: adobe/s3mock
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: gymapps-exports
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - gymapps_s3:/s3mockroot

  # Full stack from the container image; needs a filled apps/web/.env.local.
  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # Log hanya stdout; rotasi ukuran di sini + retensi 30 hari di host (lihat docs/deploy.md).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - ../apps/web/.env.local
    environment:
      DATABASE_URL: postgresql://gymapps:gymapps@postgres:5432/gymapps?schema=public
      APP_BASE_URL: http://localhost:3000
      S3_BUCKET: gymapps-exports
      S3_ENDPOINT: http://s3mock:9090
      S3_REGION: auto
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      - postgres
      - s3mock

volumes:
  gymapps_pgdata:
  gymapps_s3:
