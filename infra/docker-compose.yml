services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymapps
      POSTGRES_PASSWORD: gymapps
      POSTGRES_DB: gymapps
    ports:
      - "5432:5432"
    volumes:
      - gymapps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymapps -d gymapps"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gymapps_pgdata:
