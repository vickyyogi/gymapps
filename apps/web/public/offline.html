<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GymApps · Offline</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fafafa; color: #18181b; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px; }
    main { max-width: 420px; text-align: center; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #52525b; line-height: 1.6; margin: 6px 0; }
    a { display: inline-block; margin-top: 18px; background: #16a34a; color: white; padding: 10px 16px; border-radius: 10px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Offline</h1>
    <p>Koneksi terputus. Data latihan yang belum tersinkron tetap aman di perangkat.</p>
    <p>You are offline. Workout data that has not synced stays safe on this device.</p>
    <a href="/id/dashboard">Coba lagi / Try again</a>
  </main>
</body>
</html>
